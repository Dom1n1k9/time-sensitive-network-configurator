# Drop-in for htsn-cnc.service: cnc_opcua (open62541) segfaults during PubSub
# teardown when it receives SIGTERM (a shutdown-only crash; normal boot/run is
# clean). Force SIGKILL on stop/restart so the buggy teardown never runs; the
# kernel reclaims sockets/memory.
#
# The startup-side fix lives in tsn-apply.conf (ExecStartPost retries until 4840
# is ready and never fails the unit). The zz- prefix keeps this applied last.
[Service]
KillSignal=SIGKILL
