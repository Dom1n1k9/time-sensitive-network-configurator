# Drop-in for htsn-cnc.service: route the UADP PubSub data plane out the
# VLAN-100 interface so the high-rate OPC UA PubSub multicast rides the TSN VLAN.
#
# The cnc_opcua UADP publisher (opc.udp://239.255.42.42:8899) is the high-rate
# data plane. By default it is bound to eth0 (untagged). Pointing the UADP
# interface at eth0.100 (the 802.1Q VLAN 100 /32 host interface) makes every
# UADP frame leave eth0 tagged with VLAN 100, so the data plane is visible on
# the TSN VLAN in Wireshark / the Node-RED view, alongside the 802.1Q telemetry
# (PCP 5) + the software 802.3br preemption demo (PCP 5/7).
#
# The PCP stays 0: the RPi macb NIC has a single HW queue and no mqprio
# bandwidth mapping, so a non-zero 802.1P priority cannot be applied to the
# kernel TX path (only raw AF_PACKET frames, like the preemption demo, can carry
# a chosen PCP). The VLAN 100 tag is what puts the data plane on the TSN VLAN.
# This overrides the base unit's HTSN_PUBSUB_IFACE=eth0 (drop-ins read last).
[Service]
Environment=HTSN_PUBSUB_IFACE=eth0.100
