# Drop-in for htsn-cnc.service: re-apply the 802.1Q TSN config after cnc_opcua
# starts/restarts.
#
# Why: the cmd_tsn_config node (ns=1;i=51) resets to its default whenever
# cnc_opcua restarts, so the endpoint (STM32) reverts to untagged egress and the
# VLAN-100 telemetry disappears from the wire. Re-applying it right after the
# server comes up restores the 802.1Q-tagged traffic.
#
# ExecStartPost runs after the cnc_opcua process is spawned; the sleep gives the
# OPC UA server time to accept connections, and the CLI retries on its own if it
# is not ready yet. Runs on every start AND every restart of htsn-cnc.
[Service]
ExecStartPost=/bin/bash -c 'sleep 3; /home/wtsn/wtsn-configurator/rpi-tsn/htsn_opcua_cli write-json cmd_tsn_config /etc/htsn/tsn_cfg.json'
