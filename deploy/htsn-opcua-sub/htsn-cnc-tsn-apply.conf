# Drop-in for htsn-cnc.service: re-apply the 802.1Q TSN config after cnc_opcua
# starts/restarts.
#
# Why: the cmd_tsn_config node (ns=1;i=51) resets to its default whenever
# cnc_opcua restarts, so the endpoint (STM32) reverts to untagged egress and the
# VLAN-100 telemetry disappears from the wire. Re-applying it right after the
# server comes up restores the 802.1Q-tagged traffic.
#
# IMPORTANT: cnc_opcua can take ~20 s to accept connections on this board (its
# UADP PubSub setup on eth0.100 is slow), so a fixed `sleep 3` is far too early.
# A *failed* ExecStartPost makes systemd SIGTERM the server mid-startup, which
# then crashes during PubSub teardown (status=11/SEGV) and leaves the unit in a
# restart loop (cnc down -> bridge/poller down -> dashboard telemetry broken).
# So retry the CLI until it succeeds and ALWAYS `exit 0` (never fail the unit).
# Because ExecStartPost blocks until the server is ready, `After=htsn-cnc.service`
# also guarantees htsn-bridge/htsn-poller start only once 4840 is listening.
[Service]
TimeoutStartSec=120
ExecStartPost=/bin/bash -c 'for i in $(seq 1 90); do /home/wtsn/wtsn-configurator/rpi-tsn/htsn_opcua_cli write-json cmd_tsn_config /etc/htsn/tsn_cfg.json >/dev/null 2>&1 && exit 0; sleep 1; done; exit 0'
