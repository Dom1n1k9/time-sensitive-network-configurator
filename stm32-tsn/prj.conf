# htsn-tsn endpoint (Zephyr) — Nucleo-F767ZI
CONFIG_COMPILER_OPT="-Os"

# ---- Threads ----
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ---- Real-time preemption (gPTP timing) ----
# The Zephyr 4.5 kernel is fully preemptable by default (CONFIG_PREEMPT_ENABLED);
# there is no more CONFIG_PREEMPT symbol to set. Make the net I/O threads
# preemptive too, so an inbound Sync frame is handed to the socket (and the PTP
# thread's select() wakes) promptly, cutting T3 jitter. The RX thread runs at
# prio 2, the TX threads around prio 7; the PTP thread is raised to prio 4
# (tsn/ptp.c) so it sits above the TX/flow/cmd threads but below the RX thread
# and heartbeat.
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_ETH_STM32_HAL_RX_THREAD_PREEMPTIVE=y

# ---- Console: printf (LOGI/LOGW/LOGE) -> USART6 (the NUCLEO ST-Link VCP) ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=n

# ---- Networking: Zephyr net stack + POSIX sockets (replaces lwIP) ----
CONFIG_NETWORKING=y
CONFIG_POSIX_API=y
CONFIG_POSIX_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
# IPv4 multicast (gPTP slave joins 224.0.1.129, see tsn/ptp.c) is enabled by
# CONFIG_NET_IPV4=y above; Zephyr 4.5 has no separate multicast Kconfig symbol.
# AF_PACKET raw socket: used to emit 802.1Q-tagged telemetry egress (VLAN/PCP)
# once a TSN config with vlan_id>0 is applied. See tsn/eth_proto.c.
CONFIG_NET_SOCKETS_PACKET=y
# IGMPv2: required for setsockopt(IP_ADD_MEMBERSHIP) in tsn/ptp.c to actually
# join the PTP multicast group (224.0.1.129). Without it net_ipv4_igmp_join is
# compiled out and the join returns -ENOSYS, so the IPv4 layer drops the GM's
# multicast Sync/Follow_Up and the clock never locks. Selects NET_IPV4_HDR_OPTIONS.
CONFIG_NET_IPV4_IGMP=y
# Promiscuous mode: the STM32 DWc MAC driver cannot program its hardware
# multicast filter (no ETHERNET_FILTER_TYPE_DST_MAC_ADDRESS), so even with a
# successful IGMP join the NIC would drop the 224.0.1.129 frames at L2. Promisc
# lets the NIC pass them to the stack; the IGMP join above then accepts them at
# L3 and the UDP socket receives the Sync/Follow_Up/Delay_Resp.
CONFIG_NET_PROMISCUOUS_MODE=y
CONFIG_NET_IPV4_AUTO=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_DEFAULT_IF_ETHERNET=y

# Static L3 config (no DHCP): the endpoint is 192.168.1.20, the RPi/CNC is
# 192.168.1.10. The PTP + UDP control/telemetry link both ride this.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.10"
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.20"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_DHCPV4=n

# ---- Ethernet: STM32 MAC + the on-board LAN8742A PHY ----
# (auto-selected from the &ethernet node in the overlay; the PHY comes from the
# board DTS. If your Zephyr version names the driver differently, set the
# matching symbol here — see README "First build".)
CONFIG_ETH_STM32_HAL=y
CONFIG_NET_ARP_TABLE_SIZE=4
CONFIG_NET_SHELL=n

# ---- PWM: servo (SG90) + buzzer, driven by Board/pwm.c (CMSIS shim) ----
CONFIG_PWM=y

# ---- I2C: SSD1306 OLED ----
CONFIG_I2C=y

# ---- GPIO: sonar, relay, buttons, heartbeat LED ----
CONFIG_GPIO=y
