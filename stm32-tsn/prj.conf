# htsn-tsn endpoint (Zephyr) — Nucleo-F767ZI
CONFIG_COMPILER_OPT="-Os"

# ---- Threads ----
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ---- Console: printf (LOGI/LOGW/LOGE) -> USART6 (the NUCLEO ST-Link VCP) ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYSTEM=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=n

# ---- Networking: Zephyr net stack + POSIX sockets (replaces lwIP) ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_IP_AUTOCONFIG=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=10
CONFIG_NET_DEFAULT_IF_ETHERNET=y

# Static L3 config (no DHCP): the endpoint is 192.168.1.20, the RPi/CNC is
# 192.168.1.10. The PTP + UDP control/telemetry link both ride this.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.10"
CONFIG_NET_CONFIG_IPV4_ADDR="192.168.1.20/24"
CONFIG_NET_DHCPV4=n

# ---- Ethernet: STM32 MAC + the on-board LAN8742A PHY ----
# (auto-selected from the &ethernet node in the overlay; the PHY comes from the
# board DTS. If your Zephyr version names the driver differently, set the
# matching symbol here — see README "First build".)
CONFIG_STM32_ETH=y
CONFIG_NET_IF_MAX_ARP=4
CONFIG_NET_SHELL=n

# ---- PWM: servo (SG90) + buzzer, driven by Board/pwm.c (CMSIS shim) ----
CONFIG_PWM=y

# ---- I2C: SSD1306 OLED ----
CONFIG_I2C=y

# ---- GPIO: sonar, relay, buttons, heartbeat LED ----
CONFIG_GPIO=y
