# htsn_tsn — RPi as the PTP v2 grandmaster (the CNC).
#
# The STM32 endpoint (stm32-tsn/) is the PTP slave and locks to this GM over
# the same wired NIC. Start it (as root, ptpd needs NET_ADMIN) on the interface
# the endpoint connects to:
#
#   sudo ptpd -i <wired-nic> -f /etc/ptp/ptpd.conf -l /var/log/ptpd.log -f
#   (e.g.  sudo ptpd -i eth0 -f /etc/ptp/ptpd.conf)
#
# Then watch it win the GM election and the endpoint's tsn/ptp offset fall.
domain_number   0
priority1       11
slave_only      none
# The RPi macb NIC exposes a PHC (/dev/ptp0) with IEEE-1588-precise HW
# time-stamping, so the GM uses it (equivalently: ptp4l -H, as in
# systemd/htsn-ptp.service). With HW timestamps ptp4l runs 1-step (the SYNC
# carries the HW timestamp); the STM32 slave auto-detects 1-step vs 2-step
# (stm32-tsn/tsn/ptp.c: a SYNC carrying a timestamp is 1-step, else it reads
# the Follow_Up), so the sync stays locked either way.
tx_timestamp    hardware
rx_timestamp    hardware
